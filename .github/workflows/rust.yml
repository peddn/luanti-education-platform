name: Rust

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Format, Clippy and Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the stable toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test

      # The agent again, this time with the template for worlds inside.
      # Fetches game and mods at the pinned commits.
      - name: Template for worlds
        run: |
          scripts/template-build.sh
          LEP_TEMPLATE="$PWD/target/lep-template/template.tar.gz" cargo test --package lep-agent
