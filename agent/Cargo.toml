[package]
name = "lep-agent"
description = "Agent of the Luanti Education Platform: looks after the worlds on the game server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.9", features = ["derive"] }
flate2 = "1.1.11"
hex = "0.4.3"
lep-protocol = { path = "../crates/protocol" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "json"] }
rustix = { version = "1.1.6", features = ["fs"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
sha2 = "0.11.1"
tar = "0.4.46"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "time", "net"] }
toml = "1.2.1"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"

[dev-dependencies]
axum = "0.8.9"
lep-backend = { path = "../backend" }
sqlx = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
tempfile = "3.27.0"

[build-dependencies]
flate2 = "1.1.11"
hex = "0.4.3"
sha2 = "0.11.1"
tar = "0.4.46"
