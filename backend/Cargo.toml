[package]
name = "lep-backend"
description = "Web application of the Luanti Education Platform"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
hex = "0.4.3"
lep-protocol = { path = "../crates/protocol" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "sync"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
utoipa = "6.0.0"
uuid = { version = "1.29.2", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1.5"
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util", "time"] }
tower = { version = "0.5.3", features = ["util"] }
